name: Deploy web apps to Vercel

# Build each app in GitHub Actions, verify its dist/index.html, then assemble
# Vercel's prebuilt static-output contract. This avoids Vercel's remote
# STATIC_BUILD_NO_OUT_DIR detector for nested monorepo build outputs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.check.outputs.vercel }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - id: check
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          for p in VERCEL_PROJECT_CUSTOMER VERCEL_PROJECT_PARTNER VERCEL_PROJECT_EXPLORE; do
            [ -z "${!p}" ] && missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "SKIPPED (visible): missing secrets:$missing — see docs/DEPLOYMENT.md §2"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_CUSTOMER: ${{ secrets.VERCEL_PROJECT_CUSTOMER }}
          VERCEL_PROJECT_PARTNER: ${{ secrets.VERCEL_PROJECT_PARTNER }}
          VERCEL_PROJECT_EXPLORE: ${{ secrets.VERCEL_PROJECT_EXPLORE }}

  deploy:
    name: 'Deploy ${{ matrix.app }} web'
    needs: preflight
    if: needs.preflight.outputs.vercel == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            project: VERCEL_PROJECT_CUSTOMER
            workspace: '@gowayy/customer-web'
            dir: apps/gowayy-customer/web
          - app: partner
            project: VERCEL_PROJECT_PARTNER
            workspace: '@gowayy/partner-web'
            dir: apps/gowayy-partner/web
          - app: explore
            project: VERCEL_PROJECT_EXPLORE
            workspace: '@gowayy/explore-web'
            dir: apps/gowayy-explore/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install monorepo dependencies
        run: npm ci --no-audit --no-fund
      - name: Link Vercel project and pull production environment
        working-directory: ${{ matrix.dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
        run: |
          mkdir -p .vercel
          node -e 'require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID}, null, 2))'
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest env pull .env.production.local --environment=production --yes --token "$VERCEL_TOKEN"
      - name: Build app with Vercel production environment and assert Vite output exists
        run: |
          npm run build -w '${{ matrix.workspace }}'
          test -s '${{ matrix.dir }}/dist/index.html'
          echo 'Verified ${{ matrix.dir }}/dist/index.html'
      - name: Prepare Vercel static output
        run: node scripts/prepare-vercel-output.mjs '${{ matrix.app }}'
      - name: Deploy prebuilt output
        working-directory: ${{ matrix.dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

  report:
    name: Deployment report
    if: always()
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.preflight.outputs.vercel }}" = "true" ]; then
            echo "Vercel prebuilt production deploys ran for all three apps."
          else
            echo "Vercel deploys SKIPPED — missing secrets:${{ needs.preflight.outputs.missing }} (docs/DEPLOYMENT.md §2)."
          fi
          echo "deploy results: ${{ toJSON(needs.deploy.results) }}"
