name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck · unit · integration · supabase · edge · secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install mobile dependencies (customer / partner / explore)
        run: |
          npm ci --no-audit --no-fund
          (cd apps/gowayy-customer/mobile && npm ci --no-audit --no-fund)
          (cd apps/gowayy-partner/mobile && npm ci --no-audit --no-fund)
          (cd apps/gowayy-explore/mobile && npm ci --no-audit --no-fund)

      - name: Typecheck (web + shared packages)
        run: npm run typecheck

      - name: Typecheck (Expo mobile — customer)
        run: npm run typecheck:mobile

      - name: Typecheck (Expo mobile — partner)
        run: npm run typecheck:partner-mobile

      - name: Typecheck (Expo mobile — explore)
        run: npm run typecheck:explore-mobile

      - name: Unit tests
        run: npm run test

      - name: Integration tests (dev-api over HTTP)
        run: npm run test:integration

      - name: Supabase schema + seed tests (PGlite)
        run: npm run test:supabase

      - name: Edge function tests (Deno)
        run: npm run test:edge

      - name: Secret scan
        run: npm run scan:secrets

      - name: Build all three web apps
        run: npm run build:all
