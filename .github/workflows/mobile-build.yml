name: Android APK builds

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/gowayy-customer/**'
      - 'apps/gowayy-explore/**'
      - 'apps/gowayy-partner/**'
      - 'apps/dev-api/**'
      - 'packages/**'
      - 'assets/brand/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/mobile-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect affected Android apps
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.filter.outputs.customer }}
      explore: ${{ steps.filter.outputs.explore }}
      partner: ${{ steps.filter.outputs.partner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            customer:
              - 'apps/gowayy-customer/**'
              - 'apps/dev-api/**'
              - 'packages/**'
              - 'assets/brand/**'
              - 'supabase/functions/**'
              - 'supabase/migrations/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile-build.yml'
            explore:
              - 'apps/gowayy-explore/**'
              - 'apps/dev-api/**'
              - 'packages/**'
              - 'assets/brand/**'
              - 'supabase/functions/**'
              - 'supabase/migrations/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile-build.yml'
            partner:
              - 'apps/gowayy-partner/**'
              - 'apps/dev-api/**'
              - 'packages/**'
              - 'assets/brand/**'
              - 'supabase/functions/**'
              - 'supabase/migrations/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile-build.yml'

  build:
    permissions:
      contents: write
    name: Build ${{ matrix.app }} APK
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            package: app.gowayy.customer
          - app: explore
            package: app.gowayy.explore
          - app: partner
            package: app.gowayy.partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/gowayy-${{ matrix.app }}/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-37, build-tools;37.0.0, ndk;27.1.12297006'
          accept-android-sdk-licenses: true

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install app dependencies from its lockfile
        working-directory: apps/gowayy-${{ matrix.app }}/mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck app
        run: |
          case '${{ matrix.app }}' in
            customer) npm run typecheck:mobile ;;
            explore) npm run typecheck:explore-mobile ;;
            partner) npm run typecheck:partner-mobile ;;
          esac
      - id: version
        name: Set unique Android version for this build
        env:
          APP: ${{ matrix.app }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version_code="$((100000 + RUN_NUMBER))"
          base_version="$(node -p "require('./apps/gowayy-${APP}/mobile/app.json').expo.version")"
          version_name="${base_version}+build.${RUN_NUMBER}"
          node scripts/set-mobile-version.mjs "$APP" "$version_name" "$version_code"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Generate clean native Android project
        working-directory: apps/gowayy-${{ matrix.app }}/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Configure Gradle to use the protected release signing key
        run: node scripts/configure-android-signing.mjs "apps/gowayy-${{ matrix.app }}/mobile/android/app/build.gradle"

      - name: Validate and install Android signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name. Release APKs must use a persistent signing identity to update existing installations. See docs/DEPLOYMENT.md § Android signing."
              exit 1
            fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/gowayy-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          unset ANDROID_KEYSTORE_BASE64

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main'
        working-directory: apps/gowayy-${{ matrix.app }}/mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Build installable debug APK (non-production branches)
        if: github.ref != 'refs/heads/main'
        working-directory: apps/gowayy-${{ matrix.app }}/mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Inspect APK package, version, signature and archive
        env:
          APP: ${{ matrix.app }}
          EXPECTED_PACKAGE: ${{ matrix.package }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            built="apps/gowayy-${APP}/mobile/android/app/build/outputs/apk/release/app-release.apk"
            variant=release
          else
            built="apps/gowayy-${APP}/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            variant=debug
          fi
          test -s "$built"
          mkdir -p artifacts
          apk="artifacts/gowayy-${APP}.apk"
          cp "$built" "$apk"
          apkanalyzer="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apkanalyzer"
          test -x "$apksigner"
          actual_package="$($apkanalyzer manifest application-id "$apk")"
          actual_code="$($apkanalyzer manifest version-code "$apk")"
          actual_name="$($apkanalyzer manifest version-name "$apk")"
          test "$actual_package" = "$EXPECTED_PACKAGE"
          test "$actual_code" = "$((100000 + RUN_NUMBER))"
          test "$actual_name" = "$VERSION_NAME"
          "$apksigner" verify --verbose --print-certs "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          echo "Verified $APP $variant APK: $actual_package $actual_name ($actual_code), $(du -h "$apk" | cut -f1)."

      - name: Create per-app update metadata
        if: github.ref == 'refs/heads/main'
        env:
          APP: ${{ matrix.app }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/create-android-update-manifest.mjs "$APP" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "artifacts/gowayy-${APP}.apk" "android-${APP}-build-${RUN_NUMBER}"
      - name: Upload independently downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gowayy-${{ matrix.app }}-android-apk
          path: artifacts/gowayy-${{ matrix.app }}.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish this app's independently versioned release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.detect.outputs[matrix.app] == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ matrix.app }}-build-${{ github.run_number }}
          name: GOWAYY ${{ matrix.app }} Android ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: |
            Independent Android release for the **${{ matrix.app }}** app.

            Version: `${{ steps.version.outputs.name }}`
            Android version code: `${{ steps.version.outputs.code }}`
            Package: `${{ matrix.package }}`
            Commit: `${{ github.sha }}`

            Installation is user-approved by Android's package installer. Existing app data is preserved when the package signature matches.
          files: |
            artifacts/gowayy-${{ matrix.app }}.apk
            artifacts/gowayy-${{ matrix.app }}-update.json
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
