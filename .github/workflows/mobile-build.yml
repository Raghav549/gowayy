name: EAS builds (three Android apps)

on:
  push:
    branches: [main]
    paths:
      - 'apps/gowayy-customer/mobile/**'
      - 'apps/gowayy-partner/mobile/**'
      - 'apps/gowayy-explore/mobile/**'
      - 'packages/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check EAS configuration
    runs-on: ubuntu-latest
    outputs:
      eas: ${{ steps.check.outputs.eas }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - id: check
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "eas=false" >> "$GITHUB_OUTPUT"
            echo "missing= EXPO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "SKIPPED (visible, not hidden): EXPO_TOKEN not set — add it in repo Settings → Secrets and variables → Actions (an Expo access token), see docs/DEPLOYMENT.md"
          else
            echo "eas=true" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is configured."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-customer:
    name: Build GOWAYY (customer) AAB
    needs: preflight
    if: needs.preflight.outputs.eas == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gowayy-customer/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/gowayy-customer/mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive
        working-directory: apps/gowayy-customer/mobile

  build-partner:
    name: Build GOWAYY PARTNER AAB
    needs: preflight
    if: needs.preflight.outputs.eas == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gowayy-partner/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/gowayy-partner/mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive
        working-directory: apps/gowayy-partner/mobile

  build-explore:
    name: Build GOWAYY EXPLORE AAB
    needs: preflight
    if: needs.preflight.outputs.eas == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gowayy-explore/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/gowayy-explore/mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive
        working-directory: apps/gowayy-explore/mobile

  report:
    name: Build report
    if: always()
    needs: [preflight, build-customer, build-partner, build-explore]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.preflight.outputs.eas }}" = "true" ]; then
            echo "EAS builds ran for all three Android apps."
          else
            echo "EAS builds SKIPPED — missing secrets:${{ needs.preflight.outputs.missing }} (see docs/DEPLOYMENT.md). No build was attempted; nothing was hidden."
          fi
          echo "job results: customer=${{ needs.build-customer.result }} partner=${{ needs.build-partner.result }} explore=${{ needs.build-explore.result }}"
